<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GAVIX | Jogo</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
<div class="container nav">

<a href="index.html" class="logo">GAVIX</a>

<nav>
<a href="index.html">Início</a>
<a href="#relacionados">Relacionados</a>
</nav>

</div>
</header>

<main class="container">

<!-- HERO -->
<div id="game-page"></div>

<!-- GALERIA -->
<section class="gallery">

<div class="title-row">
<h2>📸 Galeria</h2>
</div>

<div class="gallery-grid">

<img id="g1" src="">
<img id="g2" src="">
<img id="g3" src="">
<img id="g4" src="">

</div>

</section>

<!-- ESPECIFICAÇÕES -->
<section class="specs">

<div class="title-row">
<h2>🎮 Informações</h2>
</div>

<div class="spec-grid">

<div class="spec-card">
<span>Plataforma</span>
<strong id="spec-plataforma">PC</strong>
</div>

<div class="spec-card">
<span>Loja</span>
<strong id="spec-loja">Steam</strong>
</div>

<div class="spec-card">
<span>Desconto</span>
<strong id="spec-desconto">0%</strong>
</div>

<div class="spec-card">
<span>Preço</span>
<strong id="spec-preco">R$ 0,00</strong>
</div>

</div>

</section>

<!-- DESCRIÇÃO -->
<section class="description">

<div class="title-row">
<h2>📖 Sobre este jogo</h2>
</div>

<p id="descricao"></p>

</section>

<!-- RELACIONADOS -->
<section id="relacionados">

<div class="title-row">
<h2>🔥 Jogos Relacionados</h2>
</div>

<div id="rel-grid" class="grid"></div>

</section>

</main>

<script src="game.js"></script>

</body>
</html>
