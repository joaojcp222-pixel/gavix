
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GAVIX | Jogo</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="admin.css">

  <style>
    body{background:#07111f;color:#fff;font-family:Arial,sans-serif;margin:0}
    .container{max-width:1200px;margin:auto;padding:20px}
    .header{background:#08172d;padding:18px 0}
    .nav{display:flex;align-items:center;gap:25px}
    .logo{font-size:38px;font-weight:800;color:#fff;text-decoration:none}
    .nav a{color:#d7e6ff;text-decoration:none}
    .game-hero{display:grid;grid-template-columns:420px 1fr;gap:40px;margin:35px 0}
    .game-cover img{width:100%;border-radius:18px}
    .game-badge{background:#2563eb;padding:6px 12px;border-radius:999px;font-size:13px}
    .game-price-old{text-decoration:line-through;color:#8ea5c8;margin-top:12px}
    .game-price{font-size:48px;color:#72ff91;font-weight:800}
    .buy-btn{display:inline-block;margin-top:20px;background:#2563eb;color:#fff;padding:15px 28px;border-radius:12px;text-decoration:none;font-weight:bold}
    .spec-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin:25px 0}
    .spec{background:#0d1b31;padding:18px;border-radius:14px}
    .gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
    .gallery img{width:100%;border-radius:12px}
    iframe{width:100%;height:420px;border:none;border-radius:14px}
    .rel-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:20px}
    @media(max-width:900px){
      .game-hero{grid-template-columns:1fr}
      .spec-grid,.rel-grid{grid-template-columns:repeat(2,1fr)}
    }
  </style>
</head>

<body>

<header class="header">
  <div class="container nav">
    <a href="index.html" class="logo">GAVIX</a>
    <a href="index.html">Início</a>
  </div>
</header>

<div class="container">

  <div id="game-page"></div>

  <h2>🎮 Informações</h2>

  <div class="spec-grid">
    <div class="spec">
      <small>Plataforma</small>
      <h3 id="spec-plataforma">PC</h3>
    </div>

    <div class="spec">
      <small>Loja</small>
      <h3 id="spec-loja">Steam</h3>
    </div>

    <div class="spec">
      <small>Desconto</small>
      <h3 id="spec-desconto">0%</h3>
    </div>

    <div class="spec">
      <small>Preço</small>
      <h3 id="spec-preco">R$ 0,00</h3>
    </div>
  </div>

  <h2>📝 Descrição</h2>
  <p id="descricao"></p>

  <h2>🏷️ Categorias</h2>
  <div id="tags" style="display:flex;gap:10px;flex-wrap:wrap"></div>

  <h2>⭐ Steam Score</h2>
  <div class="spec" style="display:flex;align-items:center;gap:18px">
    <div style="width:72px;height:72px;border-radius:50%;background:#2563eb;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:bold">
      95
    </div>
    <div>
      <strong>Extremamente Positivo</strong>
      <p>Avaliação baseada na recepção geral do jogo.</p>
    </div>
  </div>

  <h2>🎬 Trailer Oficial</h2>
  <iframe id="trailer-frame" allowfullscreen></iframe>

  <h2>🖼️ Galeria</h2>
  <div class="gallery">
    <img id="g1" src="">
    <img id="g2" src="">
    <img id="g3" src="">
    <img id="g4" src="">
  </div>

  <h2>🎯 Jogos Relacionados</h2>
  <div class="rel-grid" id="rel-grid"></div>

</div>

<script type="module" src="game.js"></script>
</body>
</html>
