<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gavix - Oferta</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>


    <header class="header">

        <div class="container header-content">

            <a
                href="index.html"
                class="logo"
            >
                GAVIX
            </a>


            <nav class="menu">

                <a href="index.html#ofertas">
                    Ofertas
                </a>

                <a href="index.html#lojas">
                    Lojas
                </a>

                <a href="index.html#categorias">
                    Categorias
                </a>

            </nav>

        </div>

    </header>



    <main class="container pagina-jogo">


        <a
            href="index.html"
            class="voltar"
        >
            ← Voltar para ofertas
        </a>


        <section
            id="detalhes-jogo"
            class="detalhes-jogo"
        >

            <div class="carregando">

                🔄 Carregando oferta...

            </div>

        </section>


        <section
            id="outras-ofertas"
            class="outras-ofertas"
        >

        </section>


    </main>



    <footer>

        <div class="container footer-content">

            <strong>
                GAVIX
            </strong>

            <span>
                Promoções de jogos
            </span>

            <span>
                © 2026 Gavix
            </span>

        </div>

    </footer>



    <script>

        async function carregarJogo() {

            const parametros =
                new URLSearchParams(
                    window.location.search
                );


            const nomeJogo =
                parametros.get("nome");


            const container =
                document.getElementById(
                    "detalhes-jogo"
                );


            const outras =
                document.getElementById(
                    "outras-ofertas"
                );


            if (!nomeJogo) {

                container.innerHTML = `
                    <div class="card">

                        <div class="card-content">

                            <h2>
                                Jogo não encontrado
                            </h2>

                            <p>
                                Nenhum jogo foi informado.
                            </p>

                        </div>

                    </div>
                `;

                return;

            }


            try {

                const resposta =
                    await fetch(
                        "data/ofertas.json?nocache=" +
                        Date.now()
                    );


                if (!resposta.ok) {

                    throw new Error(
                        "Erro ao carregar ofertas."
                    );

                }


                const ofertas =
                    await resposta.json();


                /*
                 * Procura todas as ofertas
                 * que possuem o mesmo nome.
                 */

                const ofertasDoJogo =
                    ofertas.filter(
                        function(item) {

                            return (
                                String(
                                    item.nome || ""
                                ).toLowerCase() ===
                                String(
                                    nomeJogo
                                ).toLowerCase()
                            );

                        }
                    );


                if (
                    ofertasDoJogo.length === 0
                ) {

                    container.innerHTML = `
                        <div class="card">

                            <div class="card-content">

                                <h2>
                                    Oferta não encontrada
                                </h2>

                                <p>
                                    Essa oferta pode ter expirado.
                                </p>

                            </div>

                        </div>
                    `;

                    return;

                }


                /*
                 * Melhor oferta
                 */

                const melhorOferta =
                    [...ofertasDoJogo].sort(
                        function(a, b) {

                            return (
                                Number(
                                    a.preco || 0
                                ) -
                                Number(
                                    b.preco || 0
                                )
                            );

                        }
                    )[0];


                const precoAntigo =
                    Number(
                        melhorOferta.preco_antigo
                    ) || 0;


                const precoAtual =
                    Number(
                        melhorOferta.preco
                    ) || 0;


                const economia =
                    Math.max(
                        0,
                        precoAntigo -
                        precoAtual
                    );


                const desconto =
                    Number(
                        melhorOferta.desconto
                    ) || 0;


                const simbolo =
                    melhorOferta.moeda === "USD"
                        ? "US$"
                        : "R$";


                const linkMelhorOferta =
                    melhorOferta.linkAfiliado ||
                    melhorOferta.link ||
                    "#";


                /*
                 * Página principal do jogo
                 */

                container.innerHTML = `

                    <div class="jogo-imagem">

                        <img
                            src="${melhorOferta.imagem || ""}"
                            alt="${melhorOferta.nome}"
                        >

                    </div>


                    <div class="jogo-info">

                        <span class="section-tag">
                            🔥 MELHOR OFERTA
                        </span>


                        <h1>
                            ${melhorOferta.nome}
                        </h1>


                        <div class="desconto">

                            🔥 ${desconto}% OFF

                        </div>


                        <div class="jogo-preco-antigo">

                            ${simbolo}
                            ${precoAntigo.toFixed(2)}

                        </div>


                        <div class="jogo-preco">

                            ${simbolo}
                            ${precoAtual.toFixed(2)}

                        </div>


                        <div class="jogo-economia">

                            💰 Você economiza
                            ${simbolo}
                            ${economia.toFixed(2)}

                        </div>


                        <div class="jogo-detalhes">

                            <div>

                                🏪

                                <strong>
                                    Loja
                                </strong>

                                <span>
                                    ${melhorOferta.loja || "Não informado"}
                                </span>

                            </div>


                            <div>

                                🎮

                                <strong>
                                    Plataforma
                                </strong>

                                <span>
                                    ${melhorOferta.plataforma || "PC"}
                                </span>

                            </div>

                        </div>


                        <a
                            href="${linkMelhorOferta}"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="botao jogo-botao"
                        >

                            VER MELHOR OFERTA →

                        </a>

                    </div>

                `;


                /*
                 * Outras lojas
                 */

                if (
                    ofertasDoJogo.length > 1
                ) {

                    outras.innerHTML = `

                        <div class="section-header">

                            <div>

                                <span class="section-tag">
                                    COMPARAR PREÇOS
                                </span>

                                <h2>
                                    Outras lojas
                                </h2>

                            </div>

                        </div>


                        <div class="comparacao-lojas">

                            ${ofertasDoJogo
                                .sort(
                                    function(a, b) {

                                        return (
                                            Number(
                                                a.preco || 0
                                            ) -
                                            Number(
                                                b.preco || 0
                                            )
                                        );

                                    }
                                )
                                .map(
                                    function(oferta) {

                                        const preco =
                                            Number(
                                                oferta.preco
                                            ) || 0;

                                        const link =
                                            oferta.linkAfiliado ||
                                            oferta.link ||
                                            "#";

                                        return `

                                            <div class="oferta-loja">

                                                <div>

                                                    <strong>
                                                        🏪
                                                        ${oferta.loja || "Loja"}
                                                    </strong>

                                                    <span>
                                                        🎮
                                                        ${oferta.plataforma || "PC"}
                                                    </span>

                                                </div>


                                                <div>

                                                    <strong class="preco-comparacao">

                                                        ${oferta.moeda === "USD"
                                                            ? "US$"
                                                            : "R$"}
                                                        ${preco.toFixed(2)}

                                                    </strong>


                                                    <a
                                                        href="${link}"
                                                        target="_blank"
                                                        rel="noopener noreferrer"
                                                        class="botao"
                                                    >
                                                        VER OFERTA →
                                                    </a>

                                                </div>

                                            </div>

                                        `;

                                    }
                                )
                                .join("")}

                        </div>

                    `;

                }


                document.title =
                    "Gavix - " +
                    melhorOferta.nome;


            } catch (erro) {

                console.error(
                    erro
                );


                container.innerHTML = `

                    <div class="card">

                        <div class="card-content">

                            <h2>
                                Erro ao carregar oferta
                            </h2>

                            <p>
                                Tente atualizar a página.
                            </p>

                        </div>

                    </div>

                `;

            }

        }


        carregarJogo();

    </script>

</body>

</html>
