<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GAVIX | Jogo</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="header">
    <div class="container header-content">

        <a href="index.html" class="logo">
            GAVIX
        </a>

        <nav class="menu">
            <a href="index.html">Início</a>
        </nav>

    </div>
</header>

<main class="container">

    <!-- HERO DO JOGO -->
    <section id="game-page"></section>

    <!-- GALERIA -->
    <section class="galeria-section">

        <div class="section-header">
            <h2>📸 Imagens do jogo</h2>
        </div>

        <div class="galeria-grid">

            <img id="galeria1" src="" alt="Imagem 1">

            <img id="galeria2" src="" alt="Imagem 2">

            <img id="galeria3" src="" alt="Imagem 3">

            <img id="galeria4" src="" alt="Imagem 4">

        </div>

    </section>

    <!-- INFORMAÇÕES -->
    <section class="sobre-jogo">

        <div class="section-header">
            <h2>🎮 Sobre este jogo</h2>
        </div>

        <p id="descricao-jogo">
            Carregando descrição...
        </p>

    </section>

    <!-- RELACIONADOS -->
    <section>

        <div class="section-header">
            <h2>🔥 Jogos relacionados</h2>
        </div>

        <div id="jogos-relacionados" class="lista-ofertas"></div>

    </section>

</main>

<script src="game.js"></script>

</body>
</html>
